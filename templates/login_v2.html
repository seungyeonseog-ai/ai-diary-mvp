{% extends "ui_base.html" %}{% block title %}로그인 · 나의 공간{% endblock %}
{% block content %}<header class="public-header"><a class="brand" href="/">{{icon('leaf')}}<span>나의 공간</span></a></header>
<main class="auth-page"><div class="auth-card"><img class="auth-lamp" src="/static/images/space/lamp-home-v1.png" alt=""><h1>당신의 공간에 들어가기</h1><p class="auth-intro">오늘의 이야기가 기다리고 있어요.</p>
<form id="loginForm"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" required><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<div class="auth-options"><label class="check-label"><input id="rememberId" type="checkbox">아이디 저장</label><a href="/register">회원가입</a></div>
<p id="login-error" class="inline-error" role="alert"></p><button class="primary" type="submit">로그인</button></form><a class="auth-home" href="/">홈으로 돌아가기</a></div></main>{% endblock %}
{% block scripts %}<script type="module" src="/static/js/space/login.js?v=20261103-5b"></script>{% endblock %}
