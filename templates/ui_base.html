<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}나의 공간{% endblock %}</title>
<link rel="stylesheet" href="/static/css/space-ui.css?v=20261102-4a">
{% block head %}{% endblock %}</head>
<body class="{% block body_class %}light-page{% endblock %}">
<svg class="icon-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3z"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5v16m0-16C8 2 3 3 2 4v16c4-2 7-1 10 1 3-2 6-3 10-1V4c-4-2-7-1-10 1Z"/></symbol>
<symbol id="i-leaf" viewBox="0 0 24 24"><path d="M4 22 18 4M9 15C1 15 2 7 3 6c5 1 6 5 6 9Zm4-7C12 1 19 1 21 2c0 4-3 7-8 6Zm0 5c3-3 8-2 9-1-2 5-6 5-9 1Z"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m4 18 4-13 13-3-1 16-16 3Z"/><circle cx="4" cy="19" r="1.5"/><circle cx="8" cy="5" r="1.5"/><circle cx="21" cy="2" r="1.5"/><circle cx="20" cy="18" r="1.5"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3 1-2h4l1 2 3 2 3 1v4l-2 2 1 3-1 4h-4l-3 2-3-2H5l-2-4 1-3-2-2V6l3-1Z"/><circle cx="12" cy="11" r="3"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 3 10l7 4 4 7 7-18ZM10 14 21 3"/></symbol>
<symbol id="i-photo" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="3"/><path d="m2 17 6-6 6 6 4-4 4 4M7 7h.01"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 3 6 6M3 21l1-6L16 3a3 3 0 0 1 5 5L9 20Z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3Z"/></symbol>
</defs></svg>
{% macro icon(name) %}<svg class="icon" aria-hidden="true"><use href="#i-{{name}}"/></svg>{% endmacro %}
{% block content %}{% endblock %}
<dialog id="ui-dialog" class="ui-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
 <form method="dialog"><div class="dialog-emblem">✦</div><h2 id="dialog-title"></h2><p id="dialog-description"></p>
 <div id="dialog-choices" class="dialog-choices"></div></form>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
{% block scripts %}{% endblock %}
</body></html>
